name: Deploy HTTP Tunnel Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_DIR: /opt/http-tunnel
  SERVICE_NAME: http-tunnel-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to VPS

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: 🔗 Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          LISTEN_HOST: ${{ secrets.LISTEN_HOST || '0.0.0.0' }}
          LISTEN_PORT: ${{ secrets.LISTEN_PORT || '8080' }}
          TCP_TIMEOUT: ${{ secrets.TCP_TIMEOUT || '60' }}
          UDP_TIMEOUT: ${{ secrets.UDP_TIMEOUT || '120' }}
          CONNECT_TIMEOUT: ${{ secrets.CONNECT_TIMEOUT || '8' }}
          CLEANUP_INTERVAL: ${{ secrets.CLEANUP_INTERVAL || '30' }}
          RECV_BUFFER: ${{ secrets.RECV_BUFFER || '131072' }}
          SEND_BUFFER: ${{ secrets.SEND_BUFFER || '131072' }}
          READ_CHUNK: ${{ secrets.READ_CHUNK || '65536' }}
          READ_TIMEOUT: ${{ secrets.READ_TIMEOUT || '0.01' }}
          READ_EXTEND: ${{ secrets.READ_EXTEND || '0.03' }}
          UDP_READ_TIMEOUT: ${{ secrets.UDP_READ_TIMEOUT || '0.3' }}
          MAX_POST_BYTES: ${{ secrets.MAX_POST_BYTES || '5242880' }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'INFO' }}
        run: |
          cat > /tmp/deploy_script.sh << 'SCRIPTEOF'
          #!/bin/bash
          set -e

          PROJECT_DIR="/opt/http-tunnel"
          SERVICE_NAME="http-tunnel-server"

          echo "=========================================="
          echo "  HTTP Tunnel Server Deployment"
          echo "=========================================="
          echo "  Server: $(hostname)"
          echo "  Time:   $(date)"
          echo "=========================================="
          echo ""

          # ─── Install System Packages ────────────────
          echo "[1/5] 📦 Installing system packages..."
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip python3-venv git curl

          # ─── Stop Service ───────────────────────────
          if systemctl is-active --quiet $SERVICE_NAME; then
              echo "⏹️  Stopping $SERVICE_NAME..."
              systemctl stop $SERVICE_NAME
              sleep 2
          fi

          # ─── Fix Git Ownership ──────────────────────
          git config --global --add safe.directory "$PROJECT_DIR" 2>/dev/null || true

          # ─── Deploy Code ────────────────────────────
          echo "[2/5] 📥 Deploying code..."
          if [ -d "$PROJECT_DIR/.git" ]; then
              cd "$PROJECT_DIR"
              git fetch origin --quiet
              git reset --hard origin/master --quiet
              git clean -fd -e ".env" -e "*.log" --quiet
              echo "  ✅ Code updated"
          else
              mkdir -p "$PROJECT_DIR"
              git clone --branch master https://github.com/HoomanJCode/Http-Tunnel.git "$PROJECT_DIR" --quiet
              cd "$PROJECT_DIR"
              echo "  ✅ Code cloned"
          fi

          # ─── Create .env ────────────────────────────
          echo "[3/5] ⚙️  Creating .env..."
          cat > "$PROJECT_DIR/.env" << ENVEOF
          ENCRYPTION_KEY=ENCRYPTION_KEY_PLACEHOLDER
          LISTEN_HOST=LISTEN_HOST_PLACEHOLDER
          LISTEN_PORT=LISTEN_PORT_PLACEHOLDER
          TCP_TIMEOUT=TCP_TIMEOUT_PLACEHOLDER
          UDP_TIMEOUT=UDP_TIMEOUT_PLACEHOLDER
          CONNECT_TIMEOUT=CONNECT_TIMEOUT_PLACEHOLDER
          CLEANUP_INTERVAL=CLEANUP_INTERVAL_PLACEHOLDER
          RECV_BUFFER=RECV_BUFFER_PLACEHOLDER
          SEND_BUFFER=SEND_BUFFER_PLACEHOLDER
          READ_CHUNK=READ_CHUNK_PLACEHOLDER
          READ_TIMEOUT=READ_TIMEOUT_PLACEHOLDER
          READ_EXTEND=READ_EXTEND_PLACEHOLDER
          UDP_READ_TIMEOUT=UDP_READ_TIMEOUT_PLACEHOLDER
          MAX_POST_BYTES=MAX_POST_BYTES_PLACEHOLDER
          LOG_LEVEL=LOG_LEVEL_PLACEHOLDER
          ENVEOF
          chmod 600 "$PROJECT_DIR/.env"

          # ─── Python venv ────────────────────────────
          echo "[4/5] 🐍 Setting up Python..."
          cd "$PROJECT_DIR"
          rm -rf venv
          python3 -m venv venv
          $PROJECT_DIR/venv/bin/pip install --upgrade pip setuptools wheel
          $PROJECT_DIR/venv/bin/pip install cryptography requests python-dotenv

          # ─── Verify install ─────────────────────────
          echo "  Verifying Python packages..."
          $PROJECT_DIR/venv/bin/python << 'PYEOF'
          import sys
          sys.path.insert(0, "/opt/http-tunnel")
          from cryptography.fernet import Fernet
          import requests
          from http_tunnel.server.tunnel import run_server
          print("  ✅ All modules loaded successfully")
          PYEOF

          # ─── Firewall ───────────────────────────────
          echo "[5/5] 🔥 Configuring firewall & service..."
          ufw status | grep -q "LISTEN_PORT_PLACEHOLDER/tcp" || {
              ufw allow LISTEN_PORT_PLACEHOLDER/tcp comment "HTTP Tunnel Server" > /dev/null
          }

          # ─── Systemd Service ────────────────────────
          cat > /etc/systemd/system/$SERVICE_NAME.service << SERVICEEOF
          [Unit]
          Description=HTTP Tunnel Server
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=$PROJECT_DIR
          Environment=PYTHONUNBUFFERED=1
          ExecStart=$PROJECT_DIR/venv/bin/python $PROJECT_DIR/server.py
          Restart=always
          RestartSec=5
          StandardOutput=append:/var/log/$SERVICE_NAME.log
          StandardError=append:/var/log/$SERVICE_NAME.log

          [Install]
          WantedBy=multi-user.target
          SERVICEEOF

          systemctl daemon-reload
          systemctl enable $SERVICE_NAME --quiet

          # ─── Start ──────────────────────────────────
          echo "▶️  Starting..."
          systemctl restart $SERVICE_NAME
          sleep 3

          if systemctl is-active --quiet $SERVICE_NAME; then
              echo ""
              echo "✅ RUNNING on LISTEN_HOST_PLACEHOLDER:LISTEN_PORT_PLACEHOLDER"
              echo ""
              tail -5 /var/log/$SERVICE_NAME.log 2>/dev/null || true
          else
              echo ""
              echo "❌ FAILED"
              echo ""
              echo "─── Error Log ───"
              tail -20 /var/log/$SERVICE_NAME.log 2>/dev/null || true
              echo ""
              echo "─── Journal ───"
              journalctl -u $SERVICE_NAME -n 10 --no-pager || true
              exit 1
          fi
          SCRIPTEOF

          # Replace placeholders
          sed -i "s|ENCRYPTION_KEY_PLACEHOLDER|${ENCRYPTION_KEY}|g" /tmp/deploy_script.sh
          sed -i "s|LISTEN_HOST_PLACEHOLDER|${LISTEN_HOST}|g" /tmp/deploy_script.sh
          sed -i "s|LISTEN_PORT_PLACEHOLDER|${LISTEN_PORT}|g" /tmp/deploy_script.sh
          sed -i "s|TCP_TIMEOUT_PLACEHOLDER|${TCP_TIMEOUT}|g" /tmp/deploy_script.sh
          sed -i "s|UDP_TIMEOUT_PLACEHOLDER|${UDP_TIMEOUT}|g" /tmp/deploy_script.sh
          sed -i "s|CONNECT_TIMEOUT_PLACEHOLDER|${CONNECT_TIMEOUT}|g" /tmp/deploy_script.sh
          sed -i "s|CLEANUP_INTERVAL_PLACEHOLDER|${CLEANUP_INTERVAL}|g" /tmp/deploy_script.sh
          sed -i "s|RECV_BUFFER_PLACEHOLDER|${RECV_BUFFER}|g" /tmp/deploy_script.sh
          sed -i "s|SEND_BUFFER_PLACEHOLDER|${SEND_BUFFER}|g" /tmp/deploy_script.sh
          sed -i "s|READ_CHUNK_PLACEHOLDER|${READ_CHUNK}|g" /tmp/deploy_script.sh
          sed -i "s|READ_TIMEOUT_PLACEHOLDER|${READ_TIMEOUT}|g" /tmp/deploy_script.sh
          sed -i "s|READ_EXTEND_PLACEHOLDER|${READ_EXTEND}|g" /tmp/deploy_script.sh
          sed -i "s|UDP_READ_TIMEOUT_PLACEHOLDER|${UDP_READ_TIMEOUT}|g" /tmp/deploy_script.sh
          sed -i "s|MAX_POST_BYTES_PLACEHOLDER|${MAX_POST_BYTES}|g" /tmp/deploy_script.sh
          sed -i "s|LOG_LEVEL_PLACEHOLDER|${LOG_LEVEL}|g" /tmp/deploy_script.sh

          # Upload and run
          scp -o StrictHostKeyChecking=accept-new -P ${{ secrets.VPS_PORT || '22' }} /tmp/deploy_script.sh ${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST }}:/tmp/deploy_script.sh
          ssh -o StrictHostKeyChecking=accept-new -p ${{ secrets.VPS_PORT || '22' }} ${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST }} "bash /tmp/deploy_script.sh"